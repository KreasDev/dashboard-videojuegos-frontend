server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep access/error logs active (combined format) so Fail2Ban can read
    # them in a later phase. The nginx:alpine image maps these paths to
    # stdout/stderr by default.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # Do not disclose the nginx version in the Server header or error pages.
    server_tokens off;

    # Security headers ("always" so they are also sent on error responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Single Page Application: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
