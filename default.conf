server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep access/error logs active (combined format) so Fail2Ban can read
    # them in a later phase. The Dockerfile maps these paths to stdout/stderr.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # Do not disclose the nginx version in the Server header or error pages.
    server_tokens off;
    # Remove the Server header completely (headers-more module).
    more_clear_headers Server;

    # Security headers ("always" so they are also sent on error responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # __CSP_CONNECT_SRC__ is replaced at image build time with the API URLs (see Dockerfile).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __CSP_CONNECT_SRC__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Generic error page: nginx's built-in error pages name the server software.
    # The original status code is kept.
    error_page 400 403 404 405 413 500 502 503 504 /error.html;
    location = /error.html {
        root /usr/share/nginx/error;
        internal;
    }

    # Single Page Application: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
